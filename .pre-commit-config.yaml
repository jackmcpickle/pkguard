# Pre-commit hooks, run by prek (https://prek.j178.dev).
#
#   brew install prek   # or: cargo install prek
#   prek install
#
# `cargo fmt` rewrites files in place. When it does, prek reports the commit as
# failed — re-stage with `git add -u` and commit again. Clippy never rewrites:
# it blocks the commit and leaves the fix to you, because `clippy --fix` makes
# semantic rewrites that deserve a read before they land.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked
        language: system
        types: [rust]
        pass_filenames: false
