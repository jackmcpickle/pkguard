version: 2

# One grouped PR per ecosystem per week, rather than a PR per dependency.
# Groups keep related bumps together so CI runs once and review is one diff.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  # The Astro docs site uses pnpm. There is no `pnpm` package-ecosystem value —
  # Dependabot covers npm, Yarn, and pnpm under `npm`, and picks up
  # site/pnpm-lock.yaml automatically.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      site-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      site-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
