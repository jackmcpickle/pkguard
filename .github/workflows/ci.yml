name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo llvm-cov --workspace --summary-only
      - name: Docs catalog is fresh
        run: |
          cargo run -q -p pkguard -- dump-catalog > site/src/generated/catalog.json
          git diff --exit-code site/src/generated/catalog.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Release helper scripts
        run: |
          node --test scripts/release-notes.test.mjs scripts/cargo-version-updater.test.cjs

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site run check
      - run: pnpm --dir site run build
