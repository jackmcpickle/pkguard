name: Release

# Tag-triggered release of the Rust binary. cargo-dist + release-plz will
# replace this at the distribution cutover; until then this is the whole
# release path.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (e.g. v1.0.0)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

  binaries:
    needs: create-release
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: pkguard-linux-x64
          - runner: ubuntu-24.04-arm
            artifact: pkguard-linux-arm64
          - runner: macos-13
            artifact: pkguard-darwin-x64
          - runner: macos-latest
            artifact: pkguard-darwin-arm64
          - runner: windows-latest
            artifact: pkguard-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pkguard
      - name: Attach binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          src="target/release/pkguard"
          if [[ "$ARTIFACT" == *.exe ]]; then src="target/release/pkguard.exe"; fi
          cp "$src" "$ARTIFACT"
          gh release upload "$TAG" "$ARTIFACT" --clobber
