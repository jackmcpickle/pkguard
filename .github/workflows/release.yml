name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to release (e.g. v1.0.0)
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
      CARGO_REGISTRY_TOKEN:
        required: false
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (e.g. v1.0.0)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

# Tag pushes from publish.yml already call this workflow. Those release
# commits include [skip publish]; skip the duplicate tag-triggered run.
jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file="$(mktemp)"
          changelog_file="$(mktemp)"
          if git show HEAD:CHANGELOG.md > "$changelog_file" && node scripts/release-notes.mjs "$version" "$changelog_file" > "$notes_file"; then
            echo "Using CHANGELOG.md for release notes"
          else
            echo "No CHANGELOG entry for ${TAG}; falling back to generated notes" > "$notes_file"
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$TAG" \
              --jq .body >> "$notes_file"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes_file"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$notes_file"
          fi

  crates-io:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish."
            exit 0
          fi
          # --workspace publishes pkguard-core before pkguard and waits for the
          # index to catch up in between.
          cargo publish --workspace --locked

  binaries:
    needs: create-release
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: pkguard-linux-x64
          - runner: ubuntu-24.04-arm
            artifact: pkguard-linux-arm64
          - runner: macos-15-intel
            artifact: pkguard-darwin-x64
          - runner: macos-latest
            artifact: pkguard-darwin-arm64
          - runner: windows-latest
            artifact: pkguard-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p pkguard
      - name: Attach binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          src="target/release/pkguard"
          if [[ "$ARTIFACT" == *.exe ]]; then src="target/release/pkguard.exe"; fi
          cp "$src" "$ARTIFACT"
          gh release upload "$TAG" "$ARTIFACT" --clobber

  homebrew:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/checkout@v7
        with:
          repository: jackmcpickle/homebrew-pkguard
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-pkguard
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Bump tap formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tmp="$(mktemp -d)"
          assets=(pkguard-darwin-arm64 pkguard-darwin-x64 pkguard-linux-arm64 pkguard-linux-x64)
          for asset in "${assets[@]}"; do
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$asset" --dir "$tmp"
          done
          node scripts/homebrew-formula.mjs "$version" \
            "$(sha256sum "$tmp/pkguard-darwin-arm64" | awk '{print $1}')" \
            "$(sha256sum "$tmp/pkguard-darwin-x64" | awk '{print $1}')" \
            "$(sha256sum "$tmp/pkguard-linux-arm64" | awk '{print $1}')" \
            "$(sha256sum "$tmp/pkguard-linux-x64" | awk '{print $1}')" \
            > homebrew-pkguard/Formula/pkguard.rb
          git -C homebrew-pkguard config user.name "github-actions[bot]"
          git -C homebrew-pkguard config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-pkguard add Formula/pkguard.rb
          if git -C homebrew-pkguard diff --cached --quiet; then
            echo "Formula already at ${version}"
            exit 0
          fi
          git -C homebrew-pkguard commit -m "Bump pkguard to ${version}"
          git -C homebrew-pkguard push origin HEAD:main
