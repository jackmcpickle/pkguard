name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to release (e.g. v0.1.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (e.g. v0.1.3)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file="$(mktemp)"
          changelog_file="$(mktemp)"
          git fetch --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if git show "${TAG}:CHANGELOG.md" > "$changelog_file" && bun scripts/release-notes.ts "$version" "$changelog_file" > "$notes_file"; then
            echo "Using CHANGELOG.md for release notes"
          else
            echo "No CHANGELOG entry for ${TAG}; falling back to generated notes" > "$notes_file"
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$TAG" \
              --jq .body >> "$notes_file"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes_file"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$notes_file"
          fi

  binaries:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: pkguard-linux-x64
          - target: bun-linux-arm64
            artifact: pkguard-linux-arm64
          - target: bun-darwin-x64
            artifact: pkguard-darwin-x64
          - target: bun-darwin-arm64
            artifact: pkguard-darwin-arm64
          - target: bun-windows-x64
            artifact: pkguard-windows-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build ./src/main.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.artifact }}
      - name: Attach binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "dist/${{ matrix.artifact }}" --clobber

  npm-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      # Trusted publishing (OIDC) — no npm token; provenance is implied.
      # Requires the Trusted Publisher config on npmjs.com for this repo/workflow.
      - run: npm publish --access public
