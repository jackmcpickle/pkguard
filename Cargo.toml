[workspace]
resolver = "2"
members = ["crates/pkguard-core", "crates/pkguard"]

[workspace.package]
version = "1.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/jackmcpickle/pkguard"
homepage = "https://github.com/jackmcpickle/pkguard"
readme = "README.md"
keywords = ["security", "supply-chain", "audit", "dependencies", "cli"]
categories = ["command-line-utilities", "development-tools"]

# Lints live here, not only in a CI command line, so a bare `cargo clippy`
# gives the same answer locally as it does in CI.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# priority = -1 lets the individual entries below override the group.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Rewrites a readable `match` on an Option into map_or/map_or_else. In the
# settings checks these matches read as tables; the closure form is worse.
option_if_let_else = "allow"

[workspace.dependencies]
# `version` is what crates.io resolves against; `path` is what local builds use.
# Kept in step with [workspace.package] by scripts/cargo-version-updater.cjs.
pkguard-core = { path = "crates/pkguard-core", version = "1.2.1" }
serde ={ version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "1"
toml_edit = "0.25"
thiserror = "2"
semver = "1"
sha2 = "0.11"
hex = "0.4"
directories = "6"
cap-std = "4"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
anstream = "1"
anstyle = "1"
owo-colors = "4"
dialoguer = "0.12"
insta = { version = "1", features = ["json"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
