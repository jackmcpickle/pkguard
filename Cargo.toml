[workspace]
resolver = "2"
members = ["crates/pkguard-core", "crates/pkguard"]

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/jackmcpickle/security-audit-tool"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
thiserror = "2"
anyhow = "1"
semver = "1"
sha2 = "0.10"
hex = "0.4"
directories = "6"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anstream = "0.6"
anstyle = "1"
owo-colors = "4"
dialoguer = "0.11"
insta = { version = "1", features = ["json"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
